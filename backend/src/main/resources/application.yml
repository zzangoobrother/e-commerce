spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecommerce?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    serialization:
      indent-output: true

server:
  port: 8080

jwt:
  # HS256 서명용 시크릿 — 최소 32바이트(256비트) 필요. 운영에서는 반드시 환경변수로 교체
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-1234}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}

refresh:
  # 리프레시 토큰 수명 — 7일(604800초)
  expiration-seconds: ${REFRESH_EXPIRATION_SECONDS:604800}

admin:
  seed:
    # 운영에서는 반드시 ADMIN_USERNAME / ADMIN_PASSWORD 환경변수로 교체
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin1234}

# 로컬 개발용 프로파일 — MySQL 없이 H2 인메모리로 기동한다.
# 활성화: ./gradlew bootRun --args='--spring.profiles.active=local'
#        또는 SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
# 주의: test 프로파일과 달리 local은 DataSeeder(@Profile("!test"))가 동작해
#       admin/admin1234 계정과 샘플 카탈로그가 시드된다.
# (jwt.secret 등 나머지 설정은 application.yml의 기본값을 그대로 상속한다)
spring:
  datasource:
    # MODE=MySQL로 MySQL 문법 호환, DB_CLOSE_DELAY=-1로 커넥션이 모두 닫혀도 인메모리 DB 유지
    url: jdbc:h2:mem:ecommerce-local;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # 인메모리라 매 기동 시 스키마를 새로 만든다(종료 시 폐기)
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # H2 웹 콘솔 — http://localhost:8080/h2-console (JDBC URL은 위 datasource.url과 동일하게 입력)
  h2:
    console:
      enabled: true
